<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CDN 방식 React 실습</title>

    <!-- React 18 -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <!-- React DOM 18 -->
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel (ES6 모듈 변환) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState } = React;

      const App = () => {
        const [count, setCount] = useState(0);
        const [text, setText] = useState("안녕");

        return (
          <main>
            <h1>JSX와 useState</h1>
            <p>버튼을 누르면 상태가 바뀝니다. 화면이 다시 렌더링 됩니다.</p>
            <h2>현재 값: {count}</h2>
            <button onClick={() => setCount(Math.min(10, count + 1))}>
              +1
            </button>
            <button onClick={() => setCount(Math.max(0, count - 1))}>-1</button>
            <hr />
            <h2>현재 텍스트: {text}</h2>
            <button onClick={() => setText(text + "하세요")}>+"하세요"</button>
            <button onClick={() => setText(text + "어라")}>+"어라"</button>
          </main>
        );
      };

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
